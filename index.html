<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi primera App</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1976d2">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f5f7;
    }

    .contenedor {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 12px;
      border: 1px solid #aaa;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #estado {
      margin-top: 15px;
      font-size: 14px;
    }

    .tarea {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .fecha {
      display: block;
      margin-top: 4px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="contenedor">
  <div class="tarjeta">

    <h1>Mi primera App</h1>

    <p>Agregar una tarea:</p>

    <input
      id="tarea"
      type="text"
      placeholder="Ej.: Revisar estudio de flujo"
    >

    <button id="botonGuardar" onclick="guardarTarea()">
      Guardar
    </button>

    <div id="estado"></div>

    <div id="lista"></div>

  </div>
</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbz67nzkJ2fJ1DqQfn4LpS5-kFzJUjXxwiytHrzRhEGNMrsQeFJtrnaayHUfhSE7NivB/exec";


async function cargarTareas() {

  const estado = document.getElementById("estado");

  estado.textContent = "Cargando tareas...";

  try {

    const respuesta = await fetch(API_URL);

    const datos = await respuesta.json();

    const lista = document.getElementById("lista");

    lista.innerHTML = "";

    datos.tareas.forEach(tarea => {

      const elemento = document.createElement("div");

      elemento.className = "tarea";

      let fecha = "";

      if (tarea.fecha) {
        fecha = new Date(tarea.fecha).toLocaleString("es-AR");
      }

      elemento.innerHTML = `
        ✓ ${tarea.tarea}
        <span class="fecha">${fecha}</span>
      `;

      lista.appendChild(elemento);

    });

    estado.textContent =
      datos.tareas.length + " tarea(s) guardada(s)";

  } catch (error) {

    console.error(error);

    estado.textContent =
      "Error al cargar las tareas.";

  }
}


async function guardarTarea() {

  const input = document.getElementById("tarea");

  const boton =
    document.getElementById("botonGuardar");

  const estado =
    document.getElementById("estado");

  const texto = input.value.trim();

  if (!texto) return;

  boton.disabled = true;

  estado.textContent = "Guardando...";

  try {

    await fetch(API_URL, {

      method: "POST",

      body: JSON.stringify({
        tarea: texto
      })

    });

    input.value = "";

    estado.textContent = "Tarea guardada.";

    await cargarTareas();

  } catch (error) {

    console.error(error);

    estado.textContent =
      "Error al guardar la tarea.";

  }

  boton.disabled = false;

}


cargarTareas();


if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("./sw.js");

}

</script>

</body>
</html>
