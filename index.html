<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi primera App</title>

  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#1976d2">

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f5f7;
    }

    .contenedor {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 18px;
    }

    .version {
      display: inline-block;
      background: #eeeeee;
      color: #666;
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .conexion {
      font-size: 13px;
      margin-bottom: 22px;
      font-weight: bold;
    }

    .online {
      color: #16833b;
    }

    .offline {
      color: #d17a00;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 12px;
      border: 1px solid #aaa;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #estado {
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
    }

    .tarea {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .fecha {
      display: block;
      margin-top: 4px;
      color: #777;
      font-size: 12px;
    }

    .pendiente {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 7px;
      border-radius: 5px;
      background: #fff3cd;
      color: #856404;
      font-size: 12px;
    }

  </style>
</head>

<body>

<div class="contenedor">

  <div class="tarjeta">

    <h1>Mi primera App</h1>

    <div class="version">
      Versión 1.2.0
    </div>

    <div
      id="conexion"
      class="conexion">
    </div>

    <p>Agregar una tarea:</p>

    <input
      id="tarea"
      type="text"
      placeholder="Ej.: Revisar estudio de flujo"
    >

    <button
      id="botonGuardar"
      onclick="guardarTarea()">
      Guardar
    </button>

    <div id="estado"></div>

    <div id="lista"></div>

  </div>

</div>


<script>

const VERSION_APP = "1.2.0";

const API_URL =
"https://script.google.com/macros/s/AKfycbz67nzkJ2fJ1DqQfn4LpS5-kFzJUjXxwiytHrzRhEGNMrsQeFJtrnaayHUfhSE7NivB/exec";


/* ================================
   DATOS LOCALES
================================ */

function obtenerTareasLocales() {

  return JSON.parse(
    localStorage.getItem("tareasCache") || "[]"
  );

}


function guardarTareasLocales(tareas) {

  localStorage.setItem(
    "tareasCache",
    JSON.stringify(tareas)
  );

}


function obtenerPendientes() {

  return JSON.parse(
    localStorage.getItem("tareasPendientes") || "[]"
  );

}


function guardarPendientes(tareas) {

  localStorage.setItem(
    "tareasPendientes",
    JSON.stringify(tareas)
  );

}


/* ================================
   ESTADO DE CONEXIÓN
================================ */

function mostrarConexion() {

  const elemento =
    document.getElementById("conexion");

  if (navigator.onLine) {

    elemento.textContent =
      "● Con conexión";

    elemento.className =
      "conexion online";

  }

  else {

    elemento.textContent =
      "● Sin conexión";

    elemento.className =
      "conexion offline";

  }

}


/* ================================
   MOSTRAR TAREAS
================================ */

function mostrarTareas(tareas) {

  const lista =
    document.getElementById("lista");

  lista.innerHTML = "";


  tareas.forEach(tarea => {

    const elemento =
      document.createElement("div");

    elemento.className =
      "tarea";


    let fecha = "";

    if (tarea.fecha) {

      fecha =
        new Date(tarea.fecha)
        .toLocaleString("es-AR");

    }


    elemento.innerHTML = `
      ✓ ${escaparHTML(tarea.tarea)}

      <span class="fecha">
        ${fecha}
      </span>
    `;


    lista.appendChild(elemento);

  });


  const pendientes =
    obtenerPendientes();


  pendientes.forEach(tarea => {

    const elemento =
      document.createElement("div");

    elemento.className =
      "tarea";


    elemento.innerHTML = `
      ✓ ${escaparHTML(tarea.tarea)}

      <span class="fecha">
        ${new Date(tarea.fecha)
          .toLocaleString("es-AR")}
      </span>

      <span class="pendiente">
        Pendiente de sincronización
      </span>
    `;


    lista.appendChild(elemento);

  });

}


/* ================================
   SEGURIDAD DEL TEXTO
================================ */

function escaparHTML(texto) {

  const div =
    document.createElement("div");

  div.textContent = texto;

  return div.innerHTML;

}


/* ================================
   DESCARGAR GOOGLE SHEETS
================================ */

async function cargarTareas() {

  const estado =
    document.getElementById("estado");


  if (!navigator.onLine) {

    const locales =
      obtenerTareasLocales();

    mostrarTareas(locales);

    estado.textContent =
      "Mostrando datos guardados en el celular.";

    return;

  }


  estado.textContent =
    "Actualizando tareas...";


  try {

    const respuesta =
      await fetch(
        API_URL + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "HTTP " + respuesta.status
      );

    }


    const datos =
      await respuesta.json();


    guardarTareasLocales(
      datos.tareas
    );


    mostrarTareas(
      datos.tareas
    );


    estado.textContent =
      datos.tareas.length +
      " tarea(s) sincronizada(s)";


  }

  catch (error) {

    console.error(error);


    const locales =
      obtenerTareasLocales();


    mostrarTareas(locales);


    estado.textContent =
      "No se pudo conectar. Mostrando copia local.";

  }

}


/* ================================
   GUARDAR
================================ */

async function guardarTarea() {

  const input =
    document.getElementById("tarea");

  const texto =
    input.value.trim();


  if (!texto) return;


  input.value = "";


  /*
    SI NO HAY INTERNET
  */

  if (!navigator.onLine) {

    const pendientes =
      obtenerPendientes();


    pendientes.push({

      idLocal:
        crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(),

      tarea: texto,

      fecha:
        new Date().toISOString()

    });


    guardarPendientes(
      pendientes
    );


    mostrarTareas(
      obtenerTareasLocales()
    );


    document
      .getElementById("estado")
      .textContent =
      "Guardada en el celular. Se sincronizará cuando vuelva Internet.";


    return;

  }


  /*
    SI HAY INTERNET
  */

  const guardado =
    await enviarTarea(texto);


  if (guardado) {

    await cargarTareas();

  }

  else {

    /*
      Puede figurar online pero fallar
      realmente la conexión.
    */

    const pendientes =
      obtenerPendientes();


    pendientes.push({

      idLocal:
        Date.now().toString(),

      tarea: texto,

      fecha:
        new Date().toISOString()

    });


    guardarPendientes(
      pendientes
    );


    mostrarTareas(
      obtenerTareasLocales()
    );


    document
      .getElementById("estado")
      .textContent =
      "Sin conexión con el servidor. Tarea guardada localmente.";

  }

}


/* ================================
   ENVIAR UNA TAREA
================================ */

async function enviarTarea(texto) {

  try {

    const respuesta =
      await fetch(
        API_URL,
        {
          method: "POST",

          body: JSON.stringify({
            tarea: texto
          })
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "HTTP " + respuesta.status
      );

    }


    return true;

  }

  catch (error) {

    console.error(error);

    return false;

  }

}


/* ================================
   SINCRONIZAR PENDIENTES
================================ */

async function sincronizarPendientes() {

  if (!navigator.onLine) {

    return;

  }


  let pendientes =
    obtenerPendientes();


  if (pendientes.length === 0) {

    return;

  }


  const estado =
    document.getElementById("estado");


  estado.textContent =
    "Sincronizando tareas pendientes...";


  const restantes = [];


  for (const tarea of pendientes) {

    const ok =
      await enviarTarea(
        tarea.tarea
      );


    if (!ok) {

      restantes.push(
        tarea
      );

    }

  }


  guardarPendientes(
    restantes
  );


  if (restantes.length === 0) {

    estado.textContent =
      "Sincronización completada.";

  }

  else {

    estado.textContent =
      restantes.length +
      " tarea(s) todavía pendiente(s).";

  }


  await cargarTareas();

}


/* ================================
   EVENTOS DE CONEXIÓN
================================ */

window.addEventListener(
  "online",
  async () => {

    mostrarConexion();

    await sincronizarPendientes();

    await cargarTareas();

  }
);


window.addEventListener(
  "offline",
  () => {

    mostrarConexion();

    mostrarTareas(
      obtenerTareasLocales()
    );

    document
      .getElementById("estado")
      .textContent =
      "Modo sin conexión.";

  }
);


/* ================================
   SERVICE WORKER
================================ */

if ("serviceWorker" in navigator) {

  navigator.serviceWorker
    .register("./sw.js");

}


/* ================================
   INICIO
================================ */

async function iniciar() {

  mostrarConexion();

  /*
    Primero mostramos inmediatamente
    lo que haya guardado localmente.
  */

  mostrarTareas(
    obtenerTareasLocales()
  );


  if (navigator.onLine) {

    await sincronizarPendientes();

  }


  await cargarTareas();

}


iniciar();

</script>

</body>

</html>
